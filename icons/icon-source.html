<!doctype html><html><head><style>
html,body{margin:0;width:100vw;height:100vh;background:#bbada0;}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;}
/* 3x5 tile grid forming a P; unit = 1/6.4 of the icon width */
.g{display:grid;grid-template-columns:repeat(3,17vw);grid-template-rows:repeat(5,17vw);gap:1.9vw;}
.t{border-radius:2.2vw;display:flex;align-items:center;justify-content:center;font-weight:800;color:#f9f6f2;font-size:5.8vw;letter-spacing:-0.03em}
.small{color:#776e65}
</style></head><body><div class="g">
<div class="t" style="background:#f2b179">64</div><div class="t" style="background:#f59563">128</div><div class="t" style="background:#f67c5f">256</div>
<div class="t" style="background:#edcf72;font-size:6.2vw">32</div><div></div><div class="t" style="background:#f65e3b">512</div>
<div class="t" style="background:#ede0c8;font-size:6.2vw" class="small"><span class="small">16</span></div><div class="t" style="background:#edc22e;font-size:4.4vw">2048</div><div class="t" style="background:#edcc61;font-size:4.4vw">1024</div>
<div class="t" style="background:#eee4da;font-size:7vw"><span class="small">8</span></div><div></div><div></div>
<div class="t" style="background:#eee4da;font-size:7vw"><span class="small">4</span></div><div></div><div></div>
</div></body></html>
